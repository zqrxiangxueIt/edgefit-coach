<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>EdgeFit Coach — 边缘协同健身教练</title>
<script src="/vendor/chart.umd.min.js"></script>
<style>
  :root { --bg:#0f1216; --panel:#181d24; --line:#262d37; --txt:#e8ecf1;
          --dim:#8a94a3; --acc:#4cc38a; --warn:#f0b429; --bad:#e5484d; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--txt);
         font-family:"Segoe UI",system-ui,sans-serif; padding:14px; }
  .grid { display:grid; grid-template-columns: 1fr 320px; gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line);
          border-radius:10px; padding:12px; }
  h1 { font-size:17px; font-weight:600; }
  .sub { color:var(--dim); font-size:12px; margin-top:2px; }
  video-frame { }
  #stage { position:relative; background:#000; border-radius:8px; overflow:hidden;
           min-height:360px; display:flex; align-items:center; justify-content:center; }
  #stage canvas { width:100%; height:auto; display:block; }
  #stage .empty { color:var(--dim); font-size:13px; padding:60px 0; }
  #modeBadge { position:absolute; top:10px; left:10px; background:#0009;
               padding:4px 10px; border-radius:14px; font-size:12px;
               font-family:Consolas,monospace; color:var(--acc); }
  .modes { display:flex; gap:8px; margin-top:10px; }
  .modes button { flex:1; padding:9px 0; border-radius:8px; border:1px solid var(--line);
                  background:#11161d; color:var(--dim); font-size:13px; cursor:pointer; }
  .modes button.active { background:var(--acc); color:#08130d; font-weight:700;
                         border-color:var(--acc); }
  .modes button:disabled { opacity:.45; cursor:not-allowed; }
  .modes button.m4::after { content:" M4"; font-size:10px; opacity:.7; }
  .big { font-size:56px; font-weight:800; line-height:1; color:var(--acc); }
  .row { display:flex; justify-content:space-between; padding:5px 0;
         border-bottom:1px dashed var(--line); font-size:13px; }
  .row b { color:var(--txt); }
  .row span { color:var(--dim); }
  #phase { font-family:Consolas,monospace; color:var(--warn); }
  #warnings { margin-top:10px; font-size:12px; color:var(--warn);
              max-height:120px; overflow-y:auto; }
  .charts { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:14px; }
  .chart h3 { font-size:12px; color:var(--dim); font-weight:500; margin-bottom:6px; }
  .chart canvas { height:110px !important; }
  #log { font-family:Consolas,monospace; font-size:11.5px; color:var(--dim);
         max-height:140px; overflow-y:auto; }
  #log .rep { color:var(--acc); }
  #linkState { font-size:12px; color:var(--dim); }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <h1>🏋️ EdgeFit Coach <span class="sub">Pi 5 → PC · 边缘协同弯举教练</span></h1>
          <span style="display:flex;gap:12px;align-items:center">
            <span id="linkState">连接中…</span>
            <button id="powerBtn" style="padding:6px 16px;border-radius:8px;border:1px solid var(--line);background:#11161d;color:var(--dim);font-size:13px;cursor:pointer">⏻ 开启系统</button>
          </span>
        </div>
        <div id="stage" style="margin-top:10px;position:relative">
          <span class="empty" id="standbyMsg">系统已关停 · 点击右上角 ⏻ 开启</span>
          <canvas id="video" width="960" height="540" style="display:none"></canvas>
          <div id="modeBadge" style="display:none">mode: -</div>
          <div id="sessOverlay" style="display:none;position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#000a;font-size:72px;font-weight:800;color:var(--acc);text-shadow:0 2px 12px #000"></div>
        </div>
        <div class="modes">
          <button data-mode="raw">raw 全量</button>
          <button data-mode="event">event 事件</button>
          <button data-mode="cascade">cascade 级联</button>
          <button data-mode="privacy">privacy 脱敏</button>
        </div>
      </div>
      <div class="charts">
        <div class="card chart"><h3>端到端延迟 p50 (ms)</h3><canvas id="cE2E"></canvas></div>
        <div class="card chart"><h3>带宽 (KB/s)</h3><canvas id="cBw"></canvas></div>
        <div class="card chart"><h3>接收帧率 / 丢帧</h3><canvas id="cFps"></canvas></div>
      </div>
    </div>
    <div>
      <div class="card">
        <h1>训练计划</h1>
        <div class="row"><span>组数 × 每组次数</span>
          <b><input id="inSets" type="number" value="3" min="1" max="20" style="width:36px;background:#11161d;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:2px 4px">
            组 ×
            <input id="inReps" type="number" value="8" min="1" max="100" style="width:36px;background:#11161d;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:2px 4px"> 个</b></div>
        <div class="row"><span>组间休息（秒）</span>
          <b><input id="inRest" type="number" value="60" min="5" max="600" style="width:52px;background:#11161d;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:2px 4px"> s</b></div>
        <div class="modes" style="margin-top:10px">
          <button id="btnStart" style="background:var(--acc);color:#08130d;font-weight:700">▶ 开始训练</button>
          <button id="btnStop">⏹ 结束</button>
        </div>
        <div class="modes" style="margin-top:8px">
          <button id="btnSkip">⏭ 跳过休息</button>
          <button id="btnReset">🗑 清零计数</button>
        </div>
        <div id="sessState" style="margin-top:8px;font-size:13px;color:var(--dim)">自由模式：计数持续累计</div>
      </div>
      <div class="card" style="margin-top:14px">
        <h1>训练面板</h1>
        <div class="big" id="reps">0</div>
        <div class="sub">弯举次数（全程 <span id="full">0</span> / 半程 <span id="half">0</span>）</div>
        <div class="row"><span>当前相位</span><b id="phase">idle</b></div>
        <div class="row"><span>幽灵计数被拦截</span><b id="suppressed">0</b></div>
        <div class="row"><span>链路</span><b id="link">-</b></div>
        <div class="row"><span>推理 (DML)</span><b id="infer">-</b></div>
        <div class="row"><span>A端 JPEG质量 / 运动</span><b id="aq">-</b></div>
        <div id="warnings"></div>
      </div>
      <div class="card" style="margin-top:14px">
        <h1>事件日志</h1>
        <div id="log"></div>
      </div>
    </div>
  </div>

<script>
const HIST = 60;
const mkChart = (id, color, extra={}) => new Chart(document.getElementById(id), {
  type: "line",
  data: { labels: [], datasets: [{ data: [], borderColor: color, borderWidth: 1.5,
           pointRadius: 0, tension: .25, fill: false, ...extra }] },
  options: { animation: false, plugins: { legend: { display: false } },
             scales: { x: { display: false },
                       y: { ticks: { color: "#8a94a3", font: { size: 9 } },
                            grid: { color: "#262d37" } } } }
});
const cE2E = mkChart("cE2E", "#4cc38a");
const cBw  = mkChart("cBw",  "#58a6ff");
const cFps = mkChart("cFps", "#f0b429");
const push = (chart, v) => { const d = chart.data.datasets[0].data;
  d.push(v); if (d.length > HIST) d.shift(); chart.update("none"); };

const $ = (id) => document.getElementById(id);
const canvas = $("video"), ctx = canvas.getContext("2d");

async function drawFrame(buf) {
  const bm = await createImageBitmap(new Blob([buf], { type: "image/jpeg" }));
  try {
    if (canvas.width !== bm.width) { canvas.width = bm.width; canvas.height = bm.height; }
    ctx.drawImage(bm, 0, 0);
  } finally { bm.close(); }   // N3: never leak the ImageBitmap
}

let lastIdx = 0;   // highest rep index already logged (B2: index dedup)
function setPower(on) {
  const btn = $("powerBtn");
  btn.textContent = on ? "⏻ 关停系统" : "⏻ 开启系统";
  btn.style.color = on ? "var(--bad)" : "var(--acc)";
  document.querySelectorAll(".modes button[data-mode]").forEach(b => b.disabled = !on);
  if (!on) {
    canvas.style.display = "none";
    $("modeBadge").style.display = "none";
    const msg = $("standbyMsg");
    msg.style.display = "block";
    msg.textContent = "系统已关停 · 点击右上角 ⏻ 开启";
  }
}

function renderSession(s) {
  const ov = $("sessOverlay"), txt = $("sessState");
  if (!s || s.phase === "idle") {
    ov.style.display = "none";
    txt.textContent = "自由模式：计数持续累计";
    return;
  }
  if (s.phase === "countdown") {
    ov.style.display = "flex";
    ov.textContent = Math.ceil(s.remaining_sec);
    txt.textContent = `即将开始 第1/${s.sets_total}组 · 每组${s.reps_per_set}个`;
  } else if (s.phase === "set") {
    ov.style.display = "none";
    txt.textContent = `💪 第${s.set_index}/${s.sets_total}组 · 本组 ${s.reps_in_set}/${s.reps_per_set}`;
  } else if (s.phase === "rest") {
    ov.style.display = "flex";
    ov.innerHTML = `<div style="font-size:26px;color:var(--dim)">组间休息</div>
                    <div>${Math.ceil(s.remaining_sec)}s</div>
                    <div style="font-size:16px;color:var(--dim);margin-top:8px">下一组 ${s.set_index+1}/${s.sets_total} · 可点"跳过休息"</div>`;
    txt.textContent = `休息中 · 已完成 ${s.set_reps.join(" + ")} 个`;
  } else if (s.phase === "done") {
    ov.style.display = "flex";
    ov.innerHTML = `<div style="font-size:26px">🎉 全部完成</div>
                    <div style="font-size:20px;color:var(--txt);margin-top:10px">
                    ${s.set_reps.join(" + ")} = ${s.set_reps.reduce((a,b)=>a+b,0)} 个 · 用时 ${Math.round(s.elapsed_sec)}s</div>`;
    txt.textContent = `✅ 训练完成，用时 ${Math.round(s.elapsed_sec)}s`;
  }
}

function meta(m) {
  if (m.power === "off") { setPower(false); return; }
  setPower(true);
  renderSession(m.session);
  $("standbyMsg").style.display = "none";
  $("modeBadge").style.display = "block";
  $("reps").textContent = m.reps;
  $("full").textContent = m.full;
  $("half").textContent = m.half;
  $("phase").textContent = m.phase;
  $("suppressed").textContent = m.suppressed;
  $("link").textContent = `${m.rx_fps} fps · ${m.kbps} KB/s · 丢${m.loss}`;
  $("infer").textContent = m.infer_ms ? `${m.infer_ms} ms` : "-";
  $("aq").textContent = `q${m.jpeg_q} / ${m.motion}`;
  $("modeBadge").textContent = `mode: ${m.mode}`;
  const fresh = m.last_frame_age != null && m.last_frame_age < 3;
  $("linkState").textContent = fresh ? "● 已连接" : "○ 等待帧…";
  $("linkState").style.color = fresh ? "var(--acc)" : "var(--dim)";
  $("warnings").innerHTML = (m.warnings || []).slice(-5)
    .map(w => `<div>⚠ ${w}</div>`).join("");
  document.querySelectorAll(".modes button[data-mode]").forEach(b => {
    b.classList.toggle("active", b.dataset.mode === m.mode); });
  if (m.e2e_ms != null) push(cE2E, m.e2e_ms);
  push(cBw, m.kbps);
  push(cFps, m.rx_fps);
  const evs = m.events || [];
  const last = evs[evs.length - 1];
  if (last && last.index !== lastIdx) {
    const log = $("log");
    evs.filter(e => e.index > lastIdx).forEach(e => {
      const div = document.createElement("div");
      div.className = "rep";
      div.textContent = `rep ${e.index} [${e.side}] ${e.full ? "全程" : "半程"} min=${e.min_angle}°`;
      log.prepend(div);
    });
    lastIdx = last.index;
    while (log.children.length > 20) log.lastChild.remove();
  }
}

async function post(url) {
  const r = await fetch(url, { method: "POST" });
  const j = await r.json();
  if (!r.ok) alert(j.detail || "操作失败");
  return j;
}

$("btnStart").addEventListener("click", () => post(
  `/api/session/start?sets=${+$("inSets").value || 3}&reps=${+$("inReps").value || 8}&rest=${+$("inRest").value || 60}`));
$("btnStop").addEventListener("click", () => post("/api/session/stop"));
$("btnSkip").addEventListener("click", () => post("/api/session/skip_rest"));
$("btnReset").addEventListener("click", () => post("/api/stats/reset"));

$("powerBtn").addEventListener("click", async () => {
  const btn = $("powerBtn");
  if (btn.disabled) return;
  btn.disabled = true;
  const turnOn = btn.textContent.includes("开启");
  btn.textContent = turnOn ? "⏻ 正在开启…" : "⏻ 正在关停…";
  try {
    const r = await fetch(`/api/power/${turnOn ? "on" : "off"}`, { method: "POST" });
    const j = await r.json();
    if (!r.ok) alert(j.detail || "操作失败");
    else if (j.detail && j.detail.includes("failed")) alert("启动失败: " + j.detail);
  } catch (e) { alert("操作失败: " + e); }
  finally { setTimeout(() => { btn.disabled = false; }, 1000); }
});

document.querySelectorAll(".modes button[data-mode]").forEach(btn => {
  btn.addEventListener("click", async () => {
    if (btn.disabled) return;
    btn.disabled = true;                       // N4: real guard during request
    try {
      const r = await fetch(`/api/mode/${btn.dataset.mode}`, { method: "POST" });
      const j = await r.json();
      if (!r.ok) alert(j.detail || "切换失败");
    } catch (e) { alert("切换失败: " + e); }
    finally { btn.disabled = false; }
  });
});

let retry = 0;
function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { retry = 0; };
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") { meta(JSON.parse(ev.data)); }
    else {
      const stage = $("stage");
      if (canvas.style.display === "none") {
        canvas.style.display = "block";
        stage.querySelector(".empty").style.display = "none";
      }
      drawFrame(ev.data);
    }
  };
  ws.onclose = () => {   // S1: auto-reconnect with capped backoff
    retry = Math.min(retry + 1, 4);
    $("linkState").textContent = `↻ 重连中(${retry})…`;
    $("linkState").style.color = "var(--warn)";
    setTimeout(connect, 1000 * 2 ** (retry - 1));
  };
}
connect();
</script>
</body>
</html>
